name: Build Windows app

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Copy in the game
        shell: bash
        run: |
          mkdir -p app
          cp ../app/src/main/assets/index.html app/index.html
          curl -fsSL -o app/qrcode.js https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Build portable exe
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder --win portable --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: MicroBeast-windows
          path: desktop/dist/MicroBeast.exe

      - name: Publish as a release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "desktop-${{ github.run_number }}" dist/MicroBeast.exe \
            --repo "${{ github.repository }}" \
            --title "MicroBeast for Windows ${{ github.run_number }}" \
            --notes "Download MicroBeast.exe and double-click it. No install needed. If Windows says it protected your PC, click More info, then Run anyway."
